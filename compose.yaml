# podman compose up --build
#
# Both images come from the root Containerfile (one stage each). `engine` builds
# the shared core image (packages/*) and exits; `example` is the service that runs.
services:
  engine:
    image: localhost/agent-engine-core:latest
    build:
      context: .
      target: engine
    command: ["true"]
    network_mode: none
    restart: "no"

  example:
    image: localhost/agent-engine-example:latest
    build:
      context: .
      target: example
    depends_on:
      engine:
        condition: service_completed_successfully
    # pasta instead of a compose bridge network: netavark/nftables fails on older WSL kernels.
    network_mode: pasta
    ports:
      - "3000:3000"
    environment:
      # Set MODEL=anthropic and ANTHROPIC_API_KEY (e.g. in .env) to use Claude.
      MODEL: ${MODEL:-simulated}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    restart: unless-stopped
